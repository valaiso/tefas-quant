name: Hourly TEFAS Data Pipeline

on:
  schedule:
    - cron: '*/20 * * * *' # Artık her 20 dakikada bir otomatik çalışır
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Data Pipeline
        run: python collector.py

      - name: Commit and Push Database Changes
        run: |
          git config --global user.name "Quant Bot"
          git config --global user.email "bot@quant.local"
          git add tefas.db
          git commit -m "Auto-update: TEFAS database refreshed (20m)" || echo "No changes to commit"
          git push