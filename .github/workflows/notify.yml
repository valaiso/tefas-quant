name: Aylık rapor bildirimleri

# Telefona ntfy bildirimi (her zaman açık):
#   ayın 1'i 09:00 ve 18:00 (TR) — raporlar bugün gönderilecek / gönderildi
#   ayın son günü 09:00 ve 18:00 (TR) — raporlar yarın gönderilecek
# GitHub zamanlanmış işleri geciktirebildiği için 15 dk erken başlar; betik tam saate kadar bekler.
# Ayın son gününü cron ifade edemediği için 28-31 arası çalışır, betik yarının 1'i olup olmadığına bakar.
#
# Gerekli secret: NTFY_TOPIC (telefondaki ntfy uygulamasında abone olunan kanal adı).
# Denemek için: Actions > bu iş > Run workflow.

on:
  schedule:
    - cron: '45 5 1 * *'       # 08:45 TR, ayın 1'i
    - cron: '45 14 1 * *'      # 17:45 TR, ayın 1'i
    - cron: '45 5 28-31 * *'   # 08:45 TR, ayın son günü olabilecek günler
    - cron: '45 14 28-31 * *'  # 17:45 TR
  workflow_dispatch:
    inputs:
      kind:
        description: 'Deneme bildirimi'
        type: choice
        options: [rapor-sabah, rapor-aksam, hatirlatma]
        default: rapor-sabah

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SITE_URL: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - name: Bildirimi gönder
        env:
          SCHEDULE: ${{ github.event.schedule }}
          KIND: ${{ inputs.kind }}
        run: |
          if [ -n "$KIND" ]; then
            case "$KIND" in
              rapor-sabah) python scripts/notify.py --slot sabah --now --force rapor ;;
              rapor-aksam) python scripts/notify.py --slot aksam --now --force rapor ;;
              hatirlatma)  python scripts/notify.py --slot sabah --now --force hatirlatma ;;
            esac
          elif [ "${SCHEDULE#45 5 }" != "$SCHEDULE" ]; then
            python scripts/notify.py --slot sabah
          else
            python scripts/notify.py --slot aksam
          fi
