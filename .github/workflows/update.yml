name: Günlük derecelendirme ve yayın

# Her işlem günü akşamı, günün kapanış fiyatlarıyla bir kez çalışır:
# TEFAS'tan son günleri çek -> 5 yıla buda -> skorla -> statik siteyi
# GitHub Pages'e yayınla. Gün içinde saatlik/dakikalık güncelleme yapılmaz.
#
# Ham veri (data/tefas.sqlite) depoya commit edilmez; çalıştırmalar arasında
# Actions cache'inde taşınır. Böylece depo küçük kalır, her gün yalnızca eksik
# günler çekilir.

on:
  schedule:
    # 19:00 TR (16:00 UTC). GitHub zamanlanmış işleri geciktirebildiği ya da
    # atlayabildiği için 21:00 TR'de ikinci deneme var; site zaten güncelse
    # `kontrol` adımı derlemeyi atlar, yani gün başına tek derleme olur.
    - cron: '0 16 * * 1-5'
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      full:
        description: '5 yıllık veriyi baştan çek (cache yok sayılır)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'quant/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.karar.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: karar
        env:
          SITE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          PYTHONIOENCODING: utf-8
        run: python scripts/check_fresh.py --site-url "${SITE_URL}"

  build:
    needs: kontrol
    # Zamanlanmış çalışmada yalnızca yeni kapanış varsa; elle ve kod değişikliğinde her zaman.
    if: ${{ github.event_name != 'schedule' || needs.kontrol.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Veri deposunu geri yükle
        if: ${{ github.event.inputs.full != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: data
          key: tefas-quant-db-${{ github.run_id }}
          restore-keys: tefas-quant-db-

      - name: JavaScript sözdizimi denetimi
        run: |
          set -e
          mkdir -p /tmp/esm
          for f in assets/js/*.js assets/js/views/*.js; do cp "$f" "/tmp/esm/$(basename "${f%.js}").mjs"; done
          for f in /tmp/esm/*.mjs; do node --check "$f"; done

      # Önce güncel günler çekilir, sonra eksik geçmiş yeniden eskiye doldurulur.
      # Geçmiş doldurma 20 dakikayla sınırlı: ilk kurulumda 5 yıl birkaç
      # çalışmaya yayılır ama site her seferinde güncel fiyatla yayınlanır.
      # Her 28 günlük parça hemen kaydedildiği için kesintide ilerleme kaybolmaz.
      - name: Veriyi güncelle, skorla, siteyi üret
        timeout-minutes: 35
        env:
          PYTHONIOENCODING: utf-8
          # TÜFE için TCMB EVDS anahtarı (yoksa Portföy Analiz yayınındaki seri kullanılır)
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python scripts/update.py --delay 3.0 --budget-min 20 ${{ github.event.inputs.full == 'true' && '--full' || '' }}

      - name: Veri deposunu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: tefas-quant-db-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
